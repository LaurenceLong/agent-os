[workspace]
members = [
    "crates/agent-os-sys",
    "crates/agent-os-store",
    "crates/agent-os-store-sqlite",
    "crates/agent-os-kernel",
    "crates/agent-os-thread",
    "crates/agent-os-config",
    "crates/agent-os-ecosystem",
    "crates/agent-os-distro",
    "crates/agent-os-app-server",
    "crates/agent-os-host",
    "crates/agent-os-cli",
    "crates/agent-os-conformance",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
agent-os-sys = { path = "crates/agent-os-sys" }
agent-os-store = { path = "crates/agent-os-store" }
agent-os-store-sqlite = { path = "crates/agent-os-store-sqlite" }
agent-os-kernel = { path = "crates/agent-os-kernel" }
agent-os-thread = { path = "crates/agent-os-thread" }
agent-os-config = { path = "crates/agent-os-config" }
agent-os-ecosystem = { path = "crates/agent-os-ecosystem" }
agent-os-distro = { path = "crates/agent-os-distro" }
agent-os-app-server = { path = "crates/agent-os-app-server" }
agent-os-host = { path = "crates/agent-os-host" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
sha2 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
